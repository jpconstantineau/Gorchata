version: 2

models:
  - name: int_state_intervals
    description: |
      Transforms discrete CLM events into continuous time intervals by pairing sequential events.
      Each interval represents the state of a railcar from one event to the next.
      Supports minute-precision duration calculations for downstream analytics.
    config:
      materialized: table
    columns:
      - name: interval_id
        description: Surrogate key for the interval
        tests:
          - not_null
          - unique
      
      - name: car_number
        description: Railcar identification number
        tests:
          - not_null
      
      - name: railcar_id
        description: Foreign key to dim_railcar
        tests:
          - not_null
          - relationships:
              to: ref('dim_railcar')
              field: railcar_id
      
      - name: start_event_id
        description: Event ID marking the start of this interval
        tests:
          - not_null
      
      - name: start_timestamp
        description: Timestamp when the interval begins
        tests:
          - not_null
      
      - name: start_event_type
        description: Type of event at interval start (PLAC, DEPA, ARRI, PULL)
        tests:
          - not_null
          - accepted_values:
              values: ['PLAC', 'DEPA', 'ARRI', 'PULL']
      
      - name: start_location_id
        description: Foreign key to dim_location for start location
        tests:
          - not_null
      
      - name: start_splc_code
        description: SPLC code of start location
        tests:
          - not_null
      
      - name: start_location_name
        description: Name of start location
      
      - name: end_event_id
        description: Event ID marking the end of this interval (NULL for terminal intervals)
      
      - name: end_timestamp
        description: Timestamp when the interval ends (NULL for terminal intervals)
      
      - name: end_event_type
        description: Type of event at interval end (NULL for terminal intervals)
      
      - name: end_location_id
        description: Foreign key to dim_location for end location
      
      - name: end_splc_code
        description: SPLC code of end location
      
      - name: end_location_name
        description: Name of end location
      
      - name: duration_minutes
        description: Duration of the interval in minutes (NULL for terminal intervals)
      
      - name: train_id
        description: Associated train ID if applicable
      
      - name: psr_period
        description: PSR implementation period (Pre-PSR, Transition, PSR)
        tests:
          - not_null

  - name: int_trip_segments
    description: |
      Groups state intervals into meaningful origin-destination trip segments.
      Each trip represents either a loaded movement (PLAC→PULL) or empty return (PULL→PLAC).
      Provides foundation for cycle analysis and performance metrics.
    config:
      materialized: table
    columns:
      - name: trip_segment_id
        description: Surrogate key for the trip segment
        tests:
          - not_null
          - unique
      
      - name: car_number
        description: Railcar identification number
        tests:
          - not_null
      
      - name: railcar_id
        description: Foreign key to dim_railcar
        tests:
          - not_null
          - relationships:
              to: ref('dim_railcar')
              field: railcar_id
      
      - name: trip_start_timestamp
        description: Timestamp when trip begins
        tests:
          - not_null
      
      - name: trip_end_timestamp
        description: Timestamp when trip ends
        tests:
          - not_null
      
      - name: trip_duration_minutes
        description: Total trip duration in minutes
        tests:
          - not_null
      
      - name: origin_location_id
        description: Foreign key to dim_location for trip origin
        tests:
          - not_null
      
      - name: origin_splc_code
        description: SPLC code of origin location
        tests:
          - not_null
      
      - name: destination_location_id
        description: Foreign key to dim_location for trip destination
        tests:
          - not_null
      
      - name: destination_splc_code
        description: SPLC code of destination location
        tests:
          - not_null
      
      - name: distance_miles
        description: Trip distance in miles (from dim_corridor if available)
      
      - name: is_loaded_trip
        description: TRUE if loaded trip (starts with PLAC), FALSE if empty (starts with PULL)
        tests:
          - not_null
      
      - name: train_id
        description: Associated train ID
      
      - name: psr_period
        description: PSR implementation period
        tests:
          - not_null

  - name: int_cycle_classification
    description: |
      Pairs loaded and empty trip segments into complete railcar cycles.
      A cycle consists of a loaded trip followed by an empty return, representing
      the full operational loop of a railcar. Critical for asset utilization analysis.
    config:
      materialized: table
    columns:
      - name: cycle_id
        description: Surrogate key for the cycle
        tests:
          - not_null
          - unique
      
      - name: car_number
        description: Railcar identification number
        tests:
          - not_null
      
      - name: railcar_id
        description: Foreign key to dim_railcar
        tests:
          - not_null
          - relationships:
              to: ref('dim_railcar')
              field: railcar_id
      
      - name: cycle_start_timestamp
        description: Timestamp when cycle begins (start of loaded trip)
        tests:
          - not_null
      
      - name: cycle_end_timestamp
        description: Timestamp when cycle ends (end of empty return)
        tests:
          - not_null
      
      - name: cycle_duration_days
        description: Total cycle duration in days (decimal)
        tests:
          - not_null
      
      - name: loaded_trip_segment_id
        description: Foreign key to int_trip_segments for loaded trip
        tests:
          - not_null
          - relationships:
              to: ref('int_trip_segments')
              field: trip_segment_id
      
      - name: empty_trip_segment_id
        description: Foreign key to int_trip_segments for empty trip
        tests:
          - not_null
          - relationships:
              to: ref('int_trip_segments')
              field: trip_segment_id
      
      - name: loaded_origin_splc
        description: SPLC code where loaded trip originated
        tests:
          - not_null
      
      - name: loaded_destination_splc
        description: SPLC code where loaded trip ended
        tests:
          - not_null
      
      - name: empty_origin_splc
        description: SPLC code where empty return originated
        tests:
          - not_null
      
      - name: empty_destination_splc
        description: SPLC code where empty return ended
        tests:
          - not_null
      
      - name: loaded_duration_minutes
        description: Duration of loaded trip in minutes
        tests:
          - not_null
      
      - name: empty_duration_minutes
        description: Duration of empty return in minutes
        tests:
          - not_null
      
      - name: total_distance_miles
        description: Combined distance of loaded and empty trips (if available)
      
      - name: psr_period
        description: PSR implementation period
        tests:
          - not_null
      
      - name: cycle_number
        description: Sequential cycle number per railcar (1, 2, 3, ...)
        tests:
          - not_null

  - name: int_velocity_vectors
    description: |
      Calculates velocity (miles/hour) between sequential locations for trip segments.
      Only includes trips with actual movement (origin != destination).
      Uses corridor distance when available, otherwise calculates from lat/long coordinates.
      Supports minute-precision calculations for detecting slow zones and operational inefficiencies.
    config:
      materialized: table
    columns:
      - name: velocity_vector_id
        description: Surrogate key for the velocity vector
        tests:
          - not_null
          - unique
      
      - name: railcar_id
        description: Foreign key to dim_railcar
        tests:
          - not_null
          - relationships:
              to: ref('dim_railcar')
              field: railcar_id
      
      - name: trip_segment_id
        description: Foreign key to int_trip_segments
        tests:
          - not_null
          - relationships:
              to: ref('int_trip_segments')
              field: trip_segment_id
      
      - name: origin_location_id
        description: Foreign key to dim_location for origin
        tests:
          - not_null
      
      - name: destination_location_id
        description: Foreign key to dim_location for destination
        tests:
          - not_null
      
      - name: distance_miles
        description: Distance between origin and destination in miles (from corridor or calculated)
        tests:
          - not_null
      
      - name: duration_minutes
        description: Duration of trip in minutes (minute precision using julianday)
        tests:
          - not_null
      
      - name: velocity_mph
        description: Calculated velocity in miles per hour ((distance_miles / duration_minutes) * 60)
        tests:
          - not_null
      
      - name: trip_start_timestamp
        description: Timestamp when trip started
        tests:
          - not_null
      
      - name: trip_end_timestamp
        description: Timestamp when trip ended
        tests:
          - not_null
      
      - name: psr_period
        description: PSR implementation period (Pre-PSR, Transition, PSR)
        tests:
          - not_null

  - name: int_nodal_dwell
    description: |
      Captures dwell duration at each location for railcars.
      Represents stops where railcar remained at same location for >= 5 minutes.
      Derived from state intervals where start_location = end_location.
      Supports minute-precision dwell analysis for identifying bottlenecks and shadow yards.
    config:
      materialized: table
    columns:
      - name: dwell_id
        description: Surrogate key for the dwell event
        tests:
          - not_null
          - unique
      
      - name: railcar_id
        description: Foreign key to dim_railcar
        tests:
          - not_null
          - relationships:
              to: ref('dim_railcar')
              field: railcar_id
      
      - name: location_id
        description: Foreign key to dim_location where dwell occurred
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_id
      
      - name: dwell_start_timestamp
        description: Timestamp when dwell started
        tests:
          - not_null
      
      - name: dwell_end_timestamp
        description: Timestamp when dwell ended
        tests:
          - not_null
      
      - name: dwell_duration_minutes
        description: Duration of dwell in minutes (minute precision using julianday, >= 5 minutes)
        tests:
          - not_null
      
      - name: event_type_at_arrival
        description: Event type when railcar arrived at location
        tests:
          - not_null
      
      - name: event_type_at_departure
        description: Event type when railcar departed from location
        tests:
          - not_null
      
      - name: is_loaded
        description: Whether railcar was loaded during dwell (1=loaded, 0=empty)
        tests:
          - not_null

  - name: int_dwell_classification
    description: |
      Classifies dwell events by operational signature using hierarchical business rules.
      Detects shadow yards (locations with high risk score and 2-24 hour dwells).
      Classifications: terminal, crew_change, mainline_hold, maintenance, shadow_yard_hold, unclassified.
      Shadow yard detection uses location risk score > 50 AND dwell 120-1440 minutes.
    config:
      materialized: table
    columns:
      - name: dwell_id
        description: Surrogate key for the dwell event (matches int_nodal_dwell)
        tests:
          - not_null
          - unique
      
      - name: railcar_id
        description: Foreign key to dim_railcar
        tests:
          - not_null
          - relationships:
              to: ref('dim_railcar')
              field: railcar_id
      
      - name: location_id
        description: Foreign key to dim_location where dwell occurred
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_id
      
      - name: dwell_start_timestamp
        description: Timestamp when dwell started
        tests:
          - not_null
      
      - name: dwell_end_timestamp
        description: Timestamp when dwell ended
        tests:
          - not_null
      
      - name: dwell_duration_minutes
        description: Duration of dwell in minutes
        tests:
          - not_null
      
      - name: event_type_at_arrival
        description: Event type when railcar arrived at location
        tests:
          - not_null
      
      - name: event_type_at_departure
        description: Event type when railcar departed from location
        tests:
          - not_null
      
      - name: is_loaded
        description: Whether railcar was loaded during dwell (1=loaded, 0=empty)
        tests:
          - not_null
      
      - name: dwell_classification
        description: Operational classification (terminal, crew_change, mainline_hold, maintenance, shadow_yard_hold, unclassified)
        tests:
          - not_null
          - accepted_values:
              values: ['terminal', 'crew_change', 'mainline_hold', 'maintenance', 'shadow_yard_hold', 'unclassified']
      
      - name: shadow_yard_flag
        description: Flag indicating if location is a detected shadow yard (1=yes, 0=no)
        tests:
          - not_null
      
      - name: facility_type
        description: Facility type from dim_location (terminal, interchange, yard, customer_site, siding)
        tests:
          - not_null
