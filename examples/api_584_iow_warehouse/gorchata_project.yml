# API 584 IOW Data Warehouse - Gorchata Project Configuration
# Risk-Based Integrity Operating Window (IOW) Monitoring System

name: api_584_iow_warehouse
version: 1.0.0

# Default profile (references profiles.yml)
profile: default

# Directory paths
model-paths:
  - models

seed-paths:
  - seeds

test-paths:
  - tests

# Project variables
vars:
  # Time series range: 5 years (2021-2025)
  start_date: '2021-01-01'
  end_date: '2025-12-31'
  
  # Asset configuration
  total_assets: 100
  units: ['CDU', 'VDU', 'FCC', 'HCU']
  
  # IOW criticality levels
  criticality_levels: ['Critical', 'Standard', 'Informational']

# Model configurations
models:
  api_584_iow_warehouse:
    # Default materialization: table for persistence
    materialized: table
    schema: main
    
    # Dimension tables (Phase 1)
    dimensions:
      materialized: table
      schema: main
    
    # Staging layer (Phase 2)
    staging:
      materialized: table
      schema: main
    
    # Intermediate layer (Phase 3)
    intermediate:
      materialized: table
      schema: main
