version: 2

# Reference external seed configuration
seed_config_path: seeds/seed.yml

models:
  # ===================================================================
  # DIMENSION TABLES - API 584 IOW Data Warehouse
  # Risk-Based Integrity Operating Window (IOW) Monitoring System
  # ===================================================================
  
  - name: dim_date
    description: "Date dimension for 5-year time series (2021-2025) with refinery-specific flags"
    columns:
      - name: date_key
        description: "Surrogate key for date (YYYYMMDD format)"
        data_tests:
          - unique
          - not_null
      
      - name: full_date
        description: "Full date value (YYYY-MM-DD)"
        data_tests:
          - unique
          - not_null
      
      - name: year
        description: "Calendar year (2021-2025)"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 2021
              max_value: 2025
      
      - name: quarter
        description: "Calendar quarter (1-4)"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 1
              max_value: 4
      
      - name: month
        description: "Calendar month (1-12)"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 1
              max_value: 12
      
      - name: day_of_month
        description: "Day of month (1-31)"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 1
              max_value: 31
      
      - name: day_of_week
        description: "Day of week (1=Monday, 7=Sunday)"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 1
              max_value: 7
      
      - name: day_name
        description: "Full day name (Monday, Tuesday, etc.)"
        data_tests:
          - not_null
          - not_empty_string
      
      - name: month_name
        description: "Full month name (January, February, etc.)"
        data_tests:
          - not_null
          - not_empty_string
      
      - name: is_turnaround
        description: "Flag indicating quarterly turnaround maintenance period (1=turnaround, 0=normal)"
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      
      - name: is_summer_spec
        description: "Flag indicating summer fuel specification period May-Sept (1=summer, 0=not summer)"
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      
      - name: is_winter_spec
        description: "Flag indicating winter fuel specification period Nov-March (1=winter, 0=not winter)"
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]

  - name: dim_asset
    description: "Static equipment asset dimension tracking 100 refinery assets across 4 process units"
    columns:
      - name: asset_key
        description: "Surrogate key for asset (1-100)"
        data_tests:
          - unique
          - not_null
          - accepted_range:
              min_value: 1
              max_value: 100
      
      - name: tag_id
        description: "Unique sensor tag identifier (e.g., CDU-001-PT, VDU-015-TT)"
        data_tests:
          - unique
          - not_null
          - not_empty_string
      
      - name: equipment_name
        description: "Full equipment name (e.g., Atmospheric Column C-101)"
        data_tests:
          - not_null
          - not_empty_string
      
      - name: system_name
        description: "Process system name (e.g., Crude Distillation System)"
        data_tests:
          - not_null
          - not_empty_string
      
      - name: unit_name
        description: "Parent unit name (CDU, VDU, FCC, HCU)"
        data_tests:
          - not_null
          - accepted_values:
              values: ['CDU', 'VDU', 'FCC', 'HCU']
      
      - name: design_life_years
        description: "Design life in years (typically 20-40 years)"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 15
              max_value: 50
      
      - name: install_date
        description: "Installation date (between 2000-2015)"
        data_tests:
          - not_null
      
      - name: material_grade
        description: "Material specification (e.g., CS A106 Gr B, SS 316L, 9Cr-1Mo)"
        data_tests:
          - not_null
          - not_empty_string
      
      - name: damage_mechanism_primary
        description: "Primary damage mechanism per API 571 (e.g., Sulfidation, Naphthenic Acid Corrosion, Hydrogen Attack)"
        data_tests:
          - not_null
          - not_empty_string
      
      - name: damage_mechanism_secondary
        description: "Secondary damage mechanism (nullable)"

  - name: dim_parameter_type
    description: "Process parameter types with normal operating ranges"
    columns:
      - name: parameter_type_key
        description: "Surrogate key for parameter type (1-4)"
        data_tests:
          - unique
          - not_null
          - accepted_range:
              min_value: 1
              max_value: 4
      
      - name: parameter_type
        description: "Type of process parameter (Pressure, Temperature, pH, Flow)"
        data_tests:
          - unique
          - not_null
          - accepted_values:
              values: ['Pressure', 'Temperature', 'pH', 'Flow']
      
      - name: units
        description: "Measurement units (psig, °F, pH units, bbl/day)"
        data_tests:
          - not_null
          - not_empty_string
      
      - name: normal_range_min
        description: "Minimum normal operating range value"
        data_tests:
          - not_null
      
      - name: normal_range_max
        description: "Maximum normal operating range value"
        data_tests:
          - not_null

  - name: dim_iow_limit
    description: "Three-tier Integrity Operating Window limits (Critical/Standard/Informational)"
    columns:
      - name: limit_key
        description: "Surrogate key for IOW limit (1-12: 4 parameters × 3 criticality levels)"
        data_tests:
          - unique
          - not_null
      
      - name: parameter_type
        description: "FK to dim_parameter_type.parameter_type"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_parameter_type')
              field: parameter_type
      
      - name: criticality_level
        description: "Criticality tier: Critical (most restrictive), Standard, Informational"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Critical', 'Standard', 'Informational']
      
      - name: lower_limit
        description: "Lower bound of acceptable operating range (nullable for one-sided limits)"
      
      - name: upper_limit
        description: "Upper bound of acceptable operating range (nullable for one-sided limits)"
      
      - name: consequence_description
        description: "Description of consequences if limit is exceeded"
        data_tests:
          - not_null
          - not_empty_string

  - name: dim_criticality_level
    description: "Criticality level reference with response time requirements"
    columns:
      - name: criticality_key
        description: "Surrogate key for criticality level (1-3)"
        data_tests:
          - unique
          - not_null
          - accepted_range:
              min_value: 1
              max_value: 3
      
      - name: criticality_level
        description: "Criticality level name (Critical, Standard, Informational)"
        data_tests:
          - unique
          - not_null
          - accepted_values:
              values: ['Critical', 'Standard', 'Informational']
      
      - name: description
        description: "Description of criticality level and requirements"
        data_tests:
          - not_null
          - not_empty_string
      
      - name: response_time_hours
        description: "Required response time in hours (1=Critical, 24=Standard, 168=Informational)"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 1
              max_value: 168

  # ===================================================================
  # STAGING LAYER - Raw Sensor Telemetry (Phase 2)
  # ===================================================================
  
  - name: stg_sensor_readings
    description: "Staging table for raw sensor telemetry data with 5-minute intervals (filtered for quality)"
    columns:
      - name: reading_id
        description: "Surrogate key for sensor reading (unique identifier)"
        data_tests:
          - unique
          - not_null
      
      - name: timestamp
        description: "Timestamp when reading was taken (5-minute intervals)"
        data_tests:
          - not_null
      
      - name: tag_id
        description: "FK to dim_asset.tag_id (sensor tag identifier)"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_asset')
              field: tag_id
      
      - name: parameter_type
        description: "Type of process parameter measured (Pressure, Temperature, pH, Flow)"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Pressure', 'Temperature', 'pH', 'Flow']
          - relationships:
              to: ref('dim_parameter_type')
              field: parameter_type
      
      - name: measured_value
        description: "Actual sensor measurement value"
        data_tests:
          - not_null
      
      - name: data_quality_flag
        description: "Data quality indicator (Good, Questionable, Bad, Substituted) - Bad readings filtered out"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Good', 'Questionable', 'Substituted']
      
      - name: reading_date_key
        description: "Date key for joining to dim_date (YYYYMMDD format)"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      
      - name: hour_of_day
        description: "Hour of day (0-23) extracted from timestamp"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 0
              max_value: 23
      
      - name: is_excursion_candidate
        description: "Boolean flag indicating value approaches or exceeds IOW limits (1=candidate, 0=normal)"
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]

  # ===================================================================
  # INTERMEDIATE LAYER - IOW Excursion Detection (Phase 3)
  # ===================================================================
  
  - name: int_iow_excursions
    description: "Individual sensor readings that breach IOW limits at any criticality level"
    columns:
      - name: excursion_id
        description: "Surrogate key for excursion record (unique per breach)"
        data_tests:
          - unique
          - not_null
      
      - name: reading_id
        description: "FK to stg_sensor_readings.reading_id"
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_sensor_readings')
              field: reading_id
      
      - name: timestamp
        description: "Timestamp when excursion occurred"
        data_tests:
          - not_null
      
      - name: tag_id
        description: "FK to dim_asset.tag_id (sensor identifier)"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_asset')
              field: tag_id
      
      - name: asset_key
        description: "FK to dim_asset.asset_key"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_asset')
              field: asset_key
      
      - name: parameter_type
        description: "Type of parameter that breached (Pressure, Temperature, pH, Flow)"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Pressure', 'Temperature', 'pH', 'Flow']
      
      - name: measured_value
        description: "Actual sensor measurement that exceeded limit"
        data_tests:
          - not_null
      
      - name: breached_limit_value
        description: "The IOW limit value that was exceeded"
        data_tests:
          - not_null
      
      - name: breach_type
        description: "Direction of breach: High (above upper limit) or Low (below lower limit)"
        data_tests:
          - not_null
          - accepted_values:
              values: ['High', 'Low']
      
      - name: excursion_magnitude
        description: "Absolute difference between measured value and breached limit"
        data_tests:
          - not_null
      
      - name: criticality_level
        description: "Most restrictive criticality level breached (Critical > Standard > Informational)"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Critical', 'Standard', 'Informational']
      
      - name: limit_key
        description: "FK to dim_iow_limit.limit_key (most restrictive limit breached)"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_iow_limit')
              field: limit_key

  - name: int_excursion_windows
    description: "Consecutive excursions grouped into events with 15-minute gap tolerance"
    columns:
      - name: excursion_event_id
        description: "Unique identifier for excursion event (tag_id + parameter_type + sequence)"
        data_tests:
          - unique
          - not_null
      
      - name: tag_id
        description: "FK to dim_asset.tag_id (sensor identifier)"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_asset')
              field: tag_id
      
      - name: asset_key
        description: "FK to dim_asset.asset_key"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_asset')
              field: asset_key
      
      - name: parameter_type
        description: "Type of parameter (Pressure, Temperature, pH, Flow)"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Pressure', 'Temperature', 'pH', 'Flow']
      
      - name: criticality_level
        description: "Highest criticality level during event (Critical > Standard > Informational)"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Critical', 'Standard', 'Informational']
      
      - name: excursion_start_time
        description: "Timestamp of first excursion in event window"
        data_tests:
          - not_null
      
      - name: excursion_end_time
        description: "Timestamp of last excursion in event window"
        data_tests:
          - not_null
      
      - name: duration_minutes
        description: "Duration of excursion event in minutes (end_time - start_time)"
        data_tests:
          - not_null
      
      - name: reading_count
        description: "Number of excursion readings within event window"
        data_tests:
          - not_null
      
      - name: peak_magnitude
        description: "Maximum excursion magnitude during event"
        data_tests:
          - not_null
      
      - name: average_magnitude
        description: "Average excursion magnitude during event"
        data_tests:
          - not_null
      
      - name: breach_type
        description: "Most common breach direction during event (High or Low)"
        data_tests:
          - not_null
          - accepted_values:
              values: ['High', 'Low']
      
      - name: limit_key
        description: "FK to dim_iow_limit.limit_key (most restrictive limit breached in event)"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_iow_limit')
              field: limit_key

  - name: int_excursion_severity
    description: "Excursion events with calculated severity scores for prioritization"
    columns:
      - name: excursion_event_id
        description: "Unique identifier for excursion event (from int_excursion_windows)"
        data_tests:
          - unique
          - not_null
      
      - name: tag_id
        description: "FK to dim_asset.tag_id (sensor identifier)"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_asset')
              field: tag_id
      
      - name: asset_key
        description: "FK to dim_asset.asset_key"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_asset')
              field: asset_key
      
      - name: parameter_type
        description: "Type of parameter (Pressure, Temperature, pH, Flow)"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Pressure', 'Temperature', 'pH', 'Flow']
      
      - name: criticality_level
        description: "Highest criticality level during event (Critical > Standard > Informational)"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Critical', 'Standard', 'Informational']
      
      - name: excursion_start_time
        description: "Timestamp of first excursion in event window"
        data_tests:
          - not_null
      
      - name: excursion_end_time
        description: "Timestamp of last excursion in event window"
        data_tests:
          - not_null
      
      - name: duration_minutes
        description: "Duration of excursion event in minutes"
        data_tests:
          - not_null
      
      - name: reading_count
        description: "Number of excursion readings within event window"
        data_tests:
          - not_null
      
      - name: peak_magnitude
        description: "Maximum excursion magnitude during event"
        data_tests:
          - not_null
      
      - name: average_magnitude
        description: "Average excursion magnitude during event"
        data_tests:
          - not_null
      
      - name: breach_type
        description: "Most common breach direction during event (High or Low)"
        data_tests:
          - not_null
          - accepted_values:
              values: ['High', 'Low']
      
      - name: limit_key
        description: "FK to dim_iow_limit.limit_key (most restrictive limit breached)"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_iow_limit')
              field: limit_key
      
      - name: severity_score
        description: "Calculated severity score (0-10 scale): (peak_magnitude × 0.4) + (duration × 0.3) + (criticality_weight × 0.3)"
        data_tests:
          - not_null
      
      - name: severity_category
        description: "Severity classification: Extreme (>8), High (5-8), Moderate (2-5), Low (<2)"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Extreme', 'High', 'Moderate', 'Low']

  # ===================================================================
  # FACT TABLES - API 584 IOW Data Warehouse (Phase 4)
  # Core operational reporting and damage tracking
  # ===================================================================
  
  - name: fact_excursion_events
    description: "Core fact table with one row per IOW excursion event including cumulative damage metrics using Area Under Curve methodology"
    columns:
      - name: excursion_event_key
        description: "Surrogate key for excursion event (auto-incrementing)"
        data_tests:
          - unique
          - not_null
      
      - name: excursion_event_id
        description: "Natural key from intermediate layer (tag_id + parameter_type + sequence)"
        data_tests:
          - unique
          - not_null
      
      - name: asset_key
        description: "FK to dim_asset.asset_key"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_asset')
              field: asset_key
      
      - name: date_key
        description: "FK to dim_date.date_key (based on excursion_start_timestamp)"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      
      - name: parameter_type_key
        description: "FK to dim_parameter_type.parameter_type_key"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_parameter_type')
              field: parameter_type_key
      
      - name: limit_key
        description: "FK to dim_iow_limit.limit_key"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_iow_limit')
              field: limit_key
      
      - name: criticality_key
        description: "FK to dim_criticality_level.criticality_key"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_criticality_level')
              field: criticality_key
      
      - name: excursion_start_timestamp
        description: "Timestamp when excursion event began"
        data_tests:
          - not_null
      
      - name: excursion_end_timestamp
        description: "Timestamp when excursion event ended"
        data_tests:
          - not_null
      
      - name: duration_minutes
        description: "Duration of excursion event in minutes"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 0
      
      - name: reading_count
        description: "Number of excursion readings within event window"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 1
      
      - name: peak_magnitude
        description: "Maximum excursion magnitude during event"
        data_tests:
          - not_null
      
      - name: average_magnitude
        description: "Average excursion magnitude during event"
        data_tests:
          - not_null
      
      - name: cumulative_damage_index
        description: "Cumulative damage using Area Under Curve: average_magnitude × duration_minutes"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 0
      
      - name: severity_score
        description: "Calculated severity score (0-10 scale)"
        data_tests:
          - not_null
      
      - name: severity_category
        description: "Severity classification: Extreme (>8), High (5-8), Moderate (2-5), Low (<2)"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Extreme', 'High', 'Moderate', 'Low']
      
      - name: breach_type
        description: "Direction of breach: High (above upper limit) or Low (below lower limit)"
        data_tests:
          - not_null
          - accepted_values:
              values: ['High', 'Low']
      
      - name: excursion_type
        description: "Event type classification combining parameter and breach direction"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Overpressure', 'Underpressure', 'Overtemp', 'Undertemp', 'pH_High', 'pH_Low', 'Flow_High', 'Flow_Low']

  - name: fact_asset_damage_accumulation
    description: "Aggregate damage by asset over time for lifecycle tracking with rolling damage windows"
    columns:
      - name: damage_record_key
        description: "Surrogate key for damage record (auto-incrementing)"
        data_tests:
          - unique
          - not_null
      
      - name: asset_key
        description: "FK to dim_asset.asset_key"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_asset')
              field: asset_key
      
      - name: as_of_date_key
        description: "FK to dim_date.date_key (snapshot date for damage calculation)"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      
      - name: cumulative_damage_to_date
        description: "Total cumulative damage from all excursion events up to as_of_date"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 0
      
      - name: damage_last_30_days
        description: "Cumulative damage in last 30 days from as_of_date"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 0
      
      - name: damage_last_90_days
        description: "Cumulative damage in last 90 days from as_of_date"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 0
      
      - name: damage_last_365_days
        description: "Cumulative damage in last 365 days from as_of_date"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 0
      
      - name: excursion_count_total
        description: "Total number of excursion events for this asset"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 0
      
      - name: critical_excursion_count
        description: "Number of Critical-level excursion events"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 0
      
      - name: standard_excursion_count
        description: "Number of Standard-level excursion events"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 0
      
      - name: informational_excursion_count
        description: "Number of Informational-level excursion events"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 0
      
      - name: days_since_last_critical_excursion
        description: "Number of days between as_of_date and most recent Critical excursion (NULL if never had Critical event)"
        data_tests:
          - accepted_range:
              min_value: 0
      
      - name: last_excursion_date
        description: "Date of most recent excursion event (any criticality)"
        data_tests:
          - not_null
      
      - name: asset_install_date
        description: "Installation date of asset (from dim_asset)"
        data_tests:
          - not_null
      
      - name: design_life_years
        description: "Expected design life of asset in years (from dim_asset)"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 1

  # ===================================================================
  # METRICS LAYER - API 584 IOW Data Warehouse
  # Asset Integrity Health Indices & Bad Actor Identification
  # ===================================================================

  - name: metrics_asset_integrity_index
    description: "Asset-level integrity health scores (0-100 scale) with operational KPIs for monitoring"
    columns:
      - name: asset_key
        description: "FK to dim_asset.asset_key"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_asset')
              field: asset_key
      
      - name: tag_id
        description: "Asset tag identifier from DCS (e.g., P-101, HX-201)"
        data_tests:
          - not_null
          - not_empty_string
      
      - name: equipment_name
        description: "Descriptive equipment name"
        data_tests:
          - not_null
          - not_empty_string
      
      - name: unit_name
        description: "Refinery unit (CDU, VDU, FCC, HCU)"
        data_tests:
          - not_null
          - accepted_values:
              values: ['CDU', 'VDU', 'FCC', 'HCU']
      
      - name: integrity_health_index
        description: "Asset health score 0-100 (100=perfect health, 0=critically unhealthy)"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 0
              max_value: 100
      
      - name: health_status
        description: "Health classification: Excellent (>90), Good (70-90), Fair (50-70), Poor (30-50), Critical (<30)"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Excellent', 'Good', 'Fair', 'Poor', 'Critical']
      
