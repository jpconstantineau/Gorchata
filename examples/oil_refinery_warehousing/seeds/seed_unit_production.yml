# ==============================================================================
# Unit Production Seed Data - Phase 4
# ==============================================================================
# 
# This seed file contains realistic daily unit production demonstrating:
# - Volume and weight yield calculations for each product stream
# - Multiple product streams per unit (7 products for CDU, 5 for FCC, etc.)
# - Volumetric expansion for FCC (yields > 100%)
# - Weight conservation (yields < 100% due to losses)
# - Conversion percentages for upgrading units
# - Product quality tracking (API gravity, sulfur, octane, cetane)
# - 10 days of data matching Phase 3 unit operations
#
# Unit Production Slates:
# - CDU: 7 products (light gases, naphthas, middle distillates, residue)
# - VDU: 3 products (light/heavy vacuum gas oils, vacuum residue)
# - FCC: 5 products (gas, LPG, gasoline, LCO, slurry) + coke
# - Hydrocracker: 5 products (gas, LPG, naphtha, diesel, tail)
# - Reformer: 2 products (H2, reformate)
# - Hydrotreaters: 1 main product + light gases
#
# Yield Formulas:
# - Volume Yield % = (Product Volume / Feed Volume) × 100
# - Weight Yield % = (Product Weight / Feed Weight) × 100
# - Conversion % = (Light Products < Cutpoint / Feed) × 100
# - Feed volumes from FACT_UNIT_FEED (Phase 3 seed data)
#
# Physical Constraints:
# - Volume yield sum: 95-110% (can exceed 100% for cracking units)
# - Weight yield sum: 95-99% (always < 100% due to losses)
# ==============================================================================

