# ==============================================================================
# Unit Operations Seed Data - Phase 3
# ==============================================================================
# 
# This seed file contains realistic daily unit operations demonstrating:
# - 8 major refinery process units over 10 days (80 total records)
# - Separate tracking of planned and unplanned downtime
# - Capacity utilization calculations
# - Catalyst cycle correlation (FCC, Hydrocracker, Reformer)
# - Energy consumption by unit type
# - Planned maintenance events (3-4 events)
# - Unplanned process upsets (4-6 events)
#
# Unit Hierarchy:
# - Crude Unit Complex: CDU, VDU
# - Conversion Complex: FCC, Hydrocracker
# - Clean Fuels Complex: Naphtha Hydrotreater, Diesel Hydrotreater
# - Gasoline Production Complex: Reformer, Alkylation
#
# Formulas Applied:
# - Capacity Utilization % = (Throughput / Capacity) × 100
# - Total Downtime = Planned Downtime + Unplanned Downtime
# - Operating Hours = 24 - Total Downtime
# - Energy Intensity = Energy Consumed / Throughput
# ==============================================================================

