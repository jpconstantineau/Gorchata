# ==============================================================================
# Crude Oil Receipts Seed Data
# ==============================================================================
# 
# This seed file contains realistic crude oil receipt transactions demonstrating:
# - Multiple crude grades (WTI, Brent, Maya, Dubai, Mars)
# - Various receipt modes (Pipeline, Marine, Truck)
# - Volume/weight conversions with API gravity
# - Temperature corrections
# - BS&W (Basic Sediment & Water) deductions
#
# Formulas Applied:
# - Specific Gravity: SG = 141.5 / (API + 131.5)
# - Weight (tons): Weight = Net Volume (bbl) × 0.1364 × SG
# - Net Volume: Net = Gross × (1 - BSW% / 100)
# - Temperature correction: Applied via VCF tables (simplified here)
# ==============================================================================

