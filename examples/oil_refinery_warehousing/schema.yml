      - name: closing_balance_bbl
        description: "Actual closing inventory balance in barrels at end of day (measured via tank gauge)"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 0
              max_value: 2000000
      
      - name: expected_closing_bbl
        description: "Expected closing balance calculated as: Opening + Receipts - Withdrawals"
        data_tests:
          - not_null
          - accepted_range:
              min_value: 0
              max_value: 2000000
      
      - name: variance_bbl
        description: "Inventory variance in barrels calculated as: Actual Closing - Expected Closing"
        data_tests:
          - not_null
          - accepted_range:
              min_value: -50000
              max_value: 50000
      
      - name: variance_pct
        description: "Inventory variance percentage calculated as: (Variance / Expected Closing) × 100"
        data_tests:
