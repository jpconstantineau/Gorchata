    columns:
      - name: inventory_id
        description: "Unique identifier for inventory record"
        data_tests:
          - unique
          - not_null
          - not_empty_string
      
      - name: date_key
        description: "Foreign key to dim_date (YYYYMMDD format)"
        data_tests:
